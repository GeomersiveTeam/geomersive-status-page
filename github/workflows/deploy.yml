name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'staging' || inputs.environment }}
      url: ${{ (github.event_name == 'push' || inputs.environment == 'staging') && 'https://staging.status.geomersive.example' || 'https://status.geomersive.example' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check site files
        run: test -s site/index.html && test -s site/app.js
      - name: Deploy
        run: echo "Deploying ${GITHUB_SHA::7} to ${{ github.event_name == 'push' && 'staging' || inputs.environment }}"
